<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BAULOC — Mobile Developer" />
    <meta property="og:title" content="bauloc.github.io" />
    <meta property="og:description" content="BAULOC — Mobile Developer" />
    <title>bauloc.github.io</title>
    <script>
      // Theme before first paint, so a dark-mode visitor never sees a light frame while the
      // bundle loads. A saved choice wins, else the system's. Mirrors src/lib/theme.ts.
      try {
        var saved = localStorage.getItem('bauloc:theme')
        if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
