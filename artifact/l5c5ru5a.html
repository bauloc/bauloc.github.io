<script type="application/json" id="artifact-source">"\u003c!doctype html>\n\u003chtml lang=\"vi\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>App Attest khi mua Kazh\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap\">\n\u003cstyle>\n/* Layout: a quiet table-of-contents rail beside one ~780px reading column; one column under 1080px. */\n:root {\n  --bg: #f4f5fa;\n  --surface: #ffffff;\n  --ink: #151a30;\n  --muted: #5b6079;\n  --line: #dde0eb;\n  --accent: #3445c8;\n  --accent-soft: #e8ebfc;\n  --accent-ink: #ffffff;\n  --ok: #16774e;\n  --ok-soft: #e1f2e9;\n  --warn: #8f5500;\n  --warn-soft: #fbefd6;\n  --bad: #b4312a;\n  --bad-soft: #fae5e2;\n  --code: #eef0f7;\n  --shadow: 0 1px 2px rgba(20, 26, 48, .06);\n  --font-body: \"Be Vietnam Pro\", \"Segoe UI\", system-ui, -apple-system, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #0e111d; --surface: #151a2a; --ink: #e5e8f3; --muted: #a0a6bf; --line: #283049;\n    --accent: #9ba7ff; --accent-soft: #222a4f; --accent-ink: #0e111d;\n    --ok: #5ccf98; --ok-soft: #12302a; --warn: #f1b451; --warn-soft: #33280e;\n    --bad: #ff8279; --bad-soft: #3a1c1a; --code: #1b2034; --shadow: none;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #0e111d; --surface: #151a2a; --ink: #e5e8f3; --muted: #a0a6bf; --line: #283049;\n  --accent: #9ba7ff; --accent-soft: #222a4f; --accent-ink: #0e111d;\n  --ok: #5ccf98; --ok-soft: #12302a; --warn: #f1b451; --warn-soft: #33280e;\n  --bad: #ff8279; --bad-soft: #3a1c1a; --code: #1b2034; --shadow: none;\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font-body);\n  font-size: 15.5px;\n  line-height: 1.65;\n  padding-inline: 16px;\n  padding-block: 0 72px;\n  -webkit-font-smoothing: antialiased;\n}\n@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }\na { color: var(--accent); text-underline-offset: 2px; }\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }\ncode { font-family: var(--font-mono); font-size: .86em; }\n:not(pre) > code {\n  background: var(--code);\n  padding: .08em .38em;\n  border-radius: 5px;\n  overflow-wrap: anywhere;\n}\np { margin: 0 0 12px; max-width: 68ch; }\nul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }\nul.plain li { max-width: 68ch; }\n\n/* Page frame */\n.page { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); }\n@media (min-width: 1080px) {\n  .page { grid-template-columns: 196px minmax(0, 780px); gap: 56px; justify-content: center; }\n}\n.toc { display: none; }\n@media (min-width: 1080px) {\n  .toc { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 28px); align-self: start; padding-top: 60px; }\n}\n.toc-title { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 600; }\n.toc a {\n  display: block; color: var(--muted); text-decoration: none; font-size: 13.5px;\n  padding: 5px 0 5px 12px; border-left: 2px solid var(--line);\n}\n.toc a:hover { color: var(--ink); }\n.toc a.active { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }\n.chipnav { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 2px; scrollbar-width: none; }\n.chipnav::-webkit-scrollbar { display: none; }\n.chipnav a {\n  flex: none; font-size: 13px; text-decoration: none; color: var(--muted);\n  border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px;\n}\n@media (min-width: 1080px) { .chipnav { display: none; } }\n\n/* Hero */\n.hero { padding-block: 52px 26px; border-bottom: 1px solid var(--line); }\n.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }\nh1 { font-size: clamp(28px, 4.2vw, 40px); line-height: 1.15; margin: 10px 0 12px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }\n.lead { font-size: 17.5px; line-height: 1.6; max-width: 60ch; margin: 0; }\n.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }\n.pill {\n  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted);\n  background: var(--surface); border: 1px solid var(--line); padding: 3px 11px; border-radius: 999px;\n}\n.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }\n.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }\n\n/* Sections */\nsection { padding-block: 44px 4px; scroll-margin-top: 20px; }\nh2 { font-size: 23px; line-height: 1.3; margin: 0 0 6px; font-weight: 700; text-wrap: balance; }\n.sub { color: var(--muted); margin: 0 0 20px; max-width: 64ch; }\nh3 { font-size: 16.5px; line-height: 1.4; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }\n.label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }\n\n/* Summary */\n.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }\n.card {\n  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;\n  padding: 16px 18px; box-shadow: var(--shadow); min-width: 0;\n}\n.card p { margin: 0; color: var(--muted); font-size: 14.5px; }\n\n/* Purchase flow stepper: the order is the content, so the numbers are real */\n.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }\n.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 22px; }\n.step::before {\n  counter-increment: step; content: counter(step);\n  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;\n  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 1px;\n}\n.step.buy::before { background: var(--ok-soft); color: var(--ok); }\n.step:not(:last-child)::after {\n  content: \"\"; position: absolute; left: 14.5px; top: 36px; bottom: 4px; width: 1.5px; background: var(--line);\n}\n.step p { margin: 0 0 8px; }\n.outcomes { display: flex; flex-wrap: wrap; gap: 6px; }\n.chip {\n  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;\n  padding: 2px 10px; border-radius: 999px; line-height: 1.6;\n}\n.chip.bad { background: var(--bad-soft); color: var(--bad); }\n.chip.ok { background: var(--ok-soft); color: var(--ok); }\n.chip.warn { background: var(--warn-soft); color: var(--warn); }\n.chip.neutral { background: var(--code); color: var(--muted); }\n\n.note { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin-top: 6px; }\n.note p:last-child, .trap p:last-child { margin-bottom: 0; }\n.trap { background: var(--warn-soft); border-radius: 10px; padding: 12px 16px; }\n.traps { display: grid; gap: 10px; }\n\n/* First-time registration strip */\n.strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }\n.strip li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }\n.strip li p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }\n.strip li h3 { margin: 2px 0 0; font-size: 15px; }\n\n/* Endpoints */\n.rules { display: grid; gap: 8px; margin: 0 0 8px; padding: 0; list-style: none; }\n.rules li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }\n.endpoint { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-top: 18px; overflow: hidden; box-shadow: var(--shadow); }\n.endpoint > header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }\n.method { font-family: var(--font-mono); font-size: 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 6px; }\n.path { font-family: var(--font-mono); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }\n.purpose { color: var(--muted); font-size: 14px; width: 100%; margin: 0; }\n.endpoint .body { padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }\n.endpoint .body > * { min-width: 0; }\n\n.code { position: relative; background: var(--code); border-radius: 10px; min-width: 0; }\n.code .label { display: block; padding: 10px 14px 0; }\n.code pre { margin: 0; padding: 8px 14px 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.8px; line-height: 1.55; }\n.copy {\n  position: absolute; top: 6px; right: 6px; font: 600 12px var(--font-body); color: var(--muted);\n  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer;\n}\n.copy:hover { color: var(--ink); }\n\n/* Tables */\n.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; }\nth, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }\nth { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }\ntr:last-child td { border-bottom: 0; }\ntd.k { font-weight: 600; min-width: 150px; }\ntd.nowrap { white-space: nowrap; }\n\n/* Plan */\n.plan h3 { display: flex; align-items: center; gap: 8px; }\n.plan ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; }\n.plan ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14.5px; }\n\n/* Checklist */\n.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }\n.checklist label {\n  display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer;\n  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);\n}\n.checklist input { margin-top: 4px; width: 16px; height: 16px; flex: none; accent-color: var(--accent); }\n.checklist input:checked + span { color: var(--muted); text-decoration: line-through; }\n.progress { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-variant-numeric: tabular-nums; }\n\n/* Flow diagram: one spine down the left, every exit to the right */\n.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; }\n.diagram svg { display: block; width: 100%; min-width: 640px; height: auto; font-family: var(--font-body); }\n.fl-line { stroke: var(--muted); stroke-width: 1.4; fill: none; }\n.fl-head { fill: var(--muted); }\n.fl-node { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }\n.fl-ask { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }\n.fl-start { fill: var(--accent); }\n.fl-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.2; }\n.fl-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.2; }\n.fl-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.2; }\n.fl-bg { fill: none; stroke: var(--muted); stroke-dasharray: 6 5; stroke-width: 1.2; }\n.fl-text { fill: var(--ink); font-size: 13px; }\n.fl-strong { fill: var(--ink); font-size: 13px; font-weight: 600; }\n.fl-start-text { fill: var(--accent-ink); font-size: 13.5px; font-weight: 700; }\n.fl-label { fill: var(--muted); font-size: 11.5px; }\n.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }\n\n/* Sequence diagram: who calls whom */\n.sq-life { stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; stroke-dasharray: 3 5; fill: none; }\n.sq-ret { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }\n.sq-band { fill: var(--bg); }\n.sq-msg { fill: var(--ink); font-size: 12px; paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }\n.sq-title { fill: var(--ink); font-size: 12.5px; font-weight: 600; paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }\n.sq-note { fill: var(--ink); font-size: 12px; }\n\nfooter { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }\nfooter ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }\n\u003c/style>\n\u003cstyle>:root { color-scheme: light; } body { margin: 0; }\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cnav class=\"toc\" aria-label=\"Mục lục\">\n    \u003cdiv class=\"toc-title\">Trên trang này\u003c/div>\n    \u003ca href=\"#tom-tat\">Tóm tắt\u003c/a>\n    \u003ca href=\"#apple\">Apple khuyến nghị gì\u003c/a>\n    \u003ca href=\"#luong\">Luồng bấm Mua\u003c/a>\n    \u003ca href=\"#goi-api\">Ai gọi ai\u003c/a>\n    \u003ca href=\"#dang-ky\">Đăng ký key\u003c/a>\n    \u003ca href=\"#backend\">3 endpoint\u003c/a>\n    \u003ca href=\"#verify\">Verify App Attest\u003c/a>\n    \u003ca href=\"#policy\">Policy\u003c/a>\n    \u003ca href=\"#van-hanh\">Lưu trữ và kéo lùi\u003c/a>\n    \u003ca href=\"#ios\">iOS xử lý lỗi\u003c/a>\n    \u003ca href=\"#ke-hoach\">Kế hoạch\u003c/a>\n    \u003ca href=\"#checklist\">Checklist backend\u003c/a>\n    \u003ca href=\"#con-mo\">Còn mở\u003c/a>\n  \u003c/nav>\n\n  \u003cmain>\n    \u003cheader class=\"hero\">\n      \u003cp class=\"eyebrow\">Kazoom · Mua Kazh trên iOS\u003c/p>\n      \u003ch1>App Attest khi mua Kazh\u003c/h1>\n      \u003cp class=\"lead\">Mọi kiểm tra chỉ chạy lúc user bấm Mua, và chạy tuần tự: App Attest, rồi câu trả lời của server, rồi mới mở StoreKit. User chờ thêm vài giây sau khi bấm Mua. Trang này mô tả luồng đó và việc backend cần làm.\u003c/p>\n      \u003cdiv class=\"meta\">\n        \u003cspan class=\"pill\">Cập nhật 06/10/2026\u003c/span>\n        \u003cspan class=\"pill\">\u003cspan class=\"dot ok\">\u003c/span>iOS: đã code theo luồng chốt, chưa mở PR\u003c/span>\n        \u003cspan class=\"pill\">\u003cspan class=\"dot bad\">\u003c/span>Backend: chưa có endpoint (staging trả 404)\u003c/span>\n      \u003c/div>\n    \u003c/header>\n\n    \u003cnav class=\"chipnav\" aria-label=\"Mục lục\">\n      \u003ca href=\"#tom-tat\">Tóm tắt\u003c/a>\u003ca href=\"#apple\">Apple\u003c/a>\u003ca href=\"#luong\">Luồng bấm Mua\u003c/a>\u003ca href=\"#goi-api\">Ai gọi ai\u003c/a>\u003ca href=\"#dang-ky\">Đăng ký key\u003c/a>\n      \u003ca href=\"#backend\">3 endpoint\u003c/a>\u003ca href=\"#verify\">Verify\u003c/a>\u003ca href=\"#policy\">Policy\u003c/a>\n      \u003ca href=\"#van-hanh\">Kéo lùi\u003c/a>\u003ca href=\"#ios\">iOS xử lý lỗi\u003c/a>\u003ca href=\"#ke-hoach\">Kế hoạch\u003c/a>\n      \u003ca href=\"#checklist\">Checklist\u003c/a>\u003ca href=\"#con-mo\">Còn mở\u003c/a>\n    \u003c/nav>\n\n    \u003csection id=\"tom-tat\">\n      \u003ch2>Tóm tắt\u003c/h2>\n      \u003cp class=\"sub\">Bốn điều cần nhớ trước khi đọc chi tiết.\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"card\">\n          \u003ch3>Một điểm kiểm tra, chạy tuần tự\u003c/h3>\n          \u003cp>Chỉ lúc user bấm Mua. App chờ App Attest xong và server trả lời rồi mới mở StoreKit. Mở app, mở Wallet hay mở sheet Mua Kazh không kiểm tra gì.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3>Server trả lời trước khi trừ tiền\u003c/h3>\n          \u003cp>\u003ccode>deny\u003c/code> thì chặn. Server lỗi hay quá 30 giây: lần đầu chặn và báo thử lại, từ lần thứ hai liên tiếp thì cho mua. Route chưa deploy (404) thì bỏ qua server.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3>Tiền đã trả luôn được cộng\u003c/h3>\n          \u003cp>Cổng chỉ chặn trước khi StoreKit trừ tiền. Không bao giờ từ chối cộng Kazh cho giao dịch đã trả.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3>App Attest chỉ phân loại\u003c/h3>\n          \u003cp>Nó chứng minh app Kazoom gốc chạy trên máy Apple thật, nhưng không phát hiện được jailbreak.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"apple\">\n      \u003ch2>Apple khuyến nghị gì\u003c/h2>\n      \u003cp class=\"sub\">Tóm từ session WWDC26 “Secure your apps with App Attest”, tài liệu DeviceCheck và trả lời của Apple DTS trên Developer Forums. Ý chính: attest key ở nền, ngoài thao tác của user; assertion tạo ngay lúc mua; lỗi thì giảm chức năng chứ đừng chặn thẳng.\u003c/p>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Chủ đề\u003c/th>\u003cth>Apple nói\u003c/th>\u003cth>Áp vào Kazoom\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\n              \u003ctd class=\"k\">Attest key\u003c/td>\n              \u003ctd>“Your app should collect the attestation outside of user flows. Try to perform the attestation operation on a background task.” Server nên chủ động khởi xướng việc attest; lỗi thì thử lại sau với exponential back-off.\u003c/td>\n              \u003ctd>Đăng ký key chạy nền sau khi đăng nhập, không nằm trong lúc bấm Mua. Chỉ khi bấm Mua mà chưa có key mới làm ngay, user chờ thêm.\u003c/td>\n            \u003c/tr>\n            \u003ctr>\n              \u003ctd class=\"k\">Assertion\u003c/td>\n              \u003ctd>“Generate them on demand as required. Assertions are generated locally on the device and do not round-trip Apple servers.” Server phải kiểm counter tăng dần.\u003c/td>\n              \u003ctd>Ký assertion ngay lúc bấm Mua, tuần tự, rồi chờ server trả lời mới mở StoreKit.\u003c/td>\n            \u003c/tr>\n            \u003ctr>\n              \u003ctd class=\"k\">Khi lỗi hoặc không hỗ trợ\u003c/td>\n              \u003ctd>“Degrade functionality tied to App Attest for the user. Allow limited access for the user with heightened monitoring. Avoid blocking the user directly without a comprehensive risk assessment.” \u003ccode>isSupported = false\u003c/code> là một tín hiệu rủi ro; app tự quyết có cho dùng tiếp không.\u003c/td>\n              \u003ctd>\u003ccode>unsupported\u003c/code>, \u003ccode>unavailable\u003c/code>, \u003ccode>failed\u003c/code> là allow + flag. Chỉ deny khi assertion sai hoặc tài khoản bị cờ refund.\u003c/td>\n            \u003c/tr>\n            \u003ctr>\n              \u003ctd class=\"k\">Vòng đời key\u003c/td>\n              \u003ctd>Một key cho mỗi user trên mỗi máy. Key mất khi cài lại app hay restore máy; “Don't reject new keys outright”. \u003ccode>attestKey\u003c/code> thường chỉ gọi một lần mỗi user mỗi máy, toàn app dưới 100 lần mỗi giây.\u003c/td>\n              \u003ctd>Key mới sau khi cài lại là chuyện bình thường, chỉ dùng làm tín hiệu.\u003c/td>\n            \u003c/tr>\n            \u003ctr>\n              \u003ctd class=\"k\">Tự phát hiện jailbreak\u003c/td>\n              \u003ctd>Apple DTS: “DTS doesn't support jailbreak detection… My advice is that you remove this code from your product… You should also take a good look at App Attest.”\u003c/td>\n              \u003ctd>Luật thiết bị của app chỉ là lớp phụ, có công tắc Remote Config; App Attest và server là lớp chính.\u003c/td>\n            \u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cp style=\"margin-top:10px;color:var(--muted);font-size:13.5px\">Nguồn:\n        \u003ca href=\"https://developer.apple.com/videos/play/wwdc2026/201/\" target=\"_blank\" rel=\"noopener\">WWDC26 · Secure your apps with App Attest\u003c/a> ·\n        \u003ca href=\"https://developer.apple.com/documentation/devicecheck/establishing-your-app-s-integrity\" target=\"_blank\" rel=\"noopener\">Establishing your app's integrity\u003c/a> ·\n        \u003ca href=\"https://developer.apple.com/documentation/devicecheck/preparing-to-use-the-app-attest-service\" target=\"_blank\" rel=\"noopener\">Preparing to use the App Attest service\u003c/a> ·\n        \u003ca href=\"https://developer.apple.com/forums/thread/768038\" target=\"_blank\" rel=\"noopener\">Developer Forums · trả lời của DTS\u003c/a>\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"luong\">\n      \u003ch2>Luồng bấm Mua\u003c/h2>\n      \u003cp class=\"sub\">Đọc từ trên xuống. Mỗi câu hỏi rẽ sang phải là một kết thúc; không rẽ thì đi tiếp xuống dưới. Khung nét đứt chạy nền, ngoài luồng mua.\u003c/p>\n      \u003cdiv class=\"diagram\">\n        \u003csvg viewBox=\"0 0 760 800\" role=\"img\" aria-label=\"Sơ đồ luồng bấm Mua Kazh: đăng ký key chạy nền; lúc bấm Mua kiểm tra Screen Time, Remote Config, key, ký assertion, gửi intent chờ server, luật thiết bị, rồi mới mở StoreKit\">\n          \u003cdefs>\n            \u003cmarker id=\"fl-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10z\" class=\"fl-head\"/>\u003c/marker>\n          \u003c/defs>\n\n          \u003crect x=\"16\" y=\"12\" width=\"728\" height=\"84\" rx=\"12\" class=\"fl-bg\"/>\n          \u003ctext x=\"32\" y=\"36\" class=\"fl-strong\">Chạy nền, ngoài luồng mua (theo Apple)\u003c/text>\n          \u003ctext x=\"32\" y=\"58\" class=\"fl-text\">Sau khi đăng nhập hoặc mở app, nếu Mua Kazh đang bật (cổng không off) và tài khoản chưa có key:\u003c/text>\n          \u003ctext x=\"32\" y=\"78\" class=\"fl-text\">đăng ký key App Attest (tạo key → challenge → Apple chứng nhận → /keys). Lỗi thì để lần sau.\u003c/text>\n\n          \u003crect x=\"135\" y=\"116\" width=\"150\" height=\"34\" rx=\"17\" class=\"fl-start\"/>\n          \u003ctext x=\"210\" y=\"138\" text-anchor=\"middle\" class=\"fl-start-text\">Bấm Mua\u003c/text>\n          \u003cpath d=\"M210 150V176\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n\n          \u003crect x=\"50\" y=\"178\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-ask\"/>\n          \u003ctext x=\"210\" y=\"205\" text-anchor=\"middle\" class=\"fl-text\">Screen Time tắt mua hàng?\u003c/text>\n          \u003cpath d=\"M370 200H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"404\" y=\"193\" text-anchor=\"middle\" class=\"fl-label\">có\u003c/text>\n          \u003crect x=\"440\" y=\"182\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-bad\"/>\n          \u003ctext x=\"590\" y=\"205\" text-anchor=\"middle\" class=\"fl-text\">Chặn · tắt mua hàng\u003c/text>\n          \u003cpath d=\"M210 222V246\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"220\" y=\"240\" class=\"fl-label\">không\u003c/text>\n\n          \u003crect x=\"50\" y=\"248\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-ask\"/>\n          \u003ctext x=\"210\" y=\"275\" text-anchor=\"middle\" class=\"fl-text\">Remote Config đang off?\u003c/text>\n          \u003cpath d=\"M370 270H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"404\" y=\"263\" text-anchor=\"middle\" class=\"fl-label\">có\u003c/text>\n          \u003crect x=\"440\" y=\"252\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-ok\"/>\n          \u003ctext x=\"590\" y=\"275\" text-anchor=\"middle\" class=\"fl-text\">Mở StoreKit ngay (cổng đang tắt)\u003c/text>\n          \u003cpath d=\"M210 292V316\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"220\" y=\"310\" class=\"fl-label\">không\u003c/text>\n\n          \u003crect x=\"50\" y=\"318\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-ask\"/>\n          \u003ctext x=\"210\" y=\"345\" text-anchor=\"middle\" class=\"fl-text\">Tài khoản đã có key App Attest?\u003c/text>\n          \u003cpath d=\"M370 340H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"404\" y=\"333\" text-anchor=\"middle\" class=\"fl-label\">chưa\u003c/text>\n          \u003crect x=\"440\" y=\"322\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-warn\"/>\n          \u003ctext x=\"590\" y=\"345\" text-anchor=\"middle\" class=\"fl-text\">Đăng ký key ngay (user chờ thêm)\u003c/text>\n          \u003cpath d=\"M590 358V410H372\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"481\" y=\"403\" text-anchor=\"middle\" class=\"fl-label\">xong, hoặc lỗi\u003c/text>\n          \u003cpath d=\"M210 362V386\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"220\" y=\"380\" class=\"fl-label\">có\u003c/text>\n\n          \u003crect x=\"50\" y=\"388\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-node\"/>\n          \u003ctext x=\"210\" y=\"415\" text-anchor=\"middle\" class=\"fl-text\">Ký assertion tại máy (không gọi Apple)\u003c/text>\n          \u003cpath d=\"M210 432V456\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"220\" y=\"449\" class=\"fl-label\">kèm assertion, hoặc status lỗi\u003c/text>\n\n          \u003crect x=\"50\" y=\"458\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-node\"/>\n          \u003ctext x=\"210\" y=\"485\" text-anchor=\"middle\" class=\"fl-text\">Gửi intent, chờ server (tối đa 30 giây)\u003c/text>\n          \u003cpath d=\"M210 502V526\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n\n          \u003crect x=\"50\" y=\"528\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-ask\"/>\n          \u003ctext x=\"210\" y=\"555\" text-anchor=\"middle\" class=\"fl-text\">Server trả lời thế nào?\u003c/text>\n          \u003cpath d=\"M370 550H405M405 536V624\" class=\"fl-line\"/>\n          \u003cpath d=\"M405 536H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003cpath d=\"M405 580H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003cpath d=\"M405 624H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003crect x=\"440\" y=\"518\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-bad\"/>\n          \u003ctext x=\"590\" y=\"541\" text-anchor=\"middle\" class=\"fl-text\">deny 029 → chặn · tài khoản đã refund\u003c/text>\n          \u003crect x=\"440\" y=\"562\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-bad\"/>\n          \u003ctext x=\"590\" y=\"585\" text-anchor=\"middle\" class=\"fl-text\">deny mã khác → chặn · thiết bị\u003c/text>\n          \u003crect x=\"440\" y=\"606\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-warn\"/>\n          \u003ctext x=\"590\" y=\"629\" text-anchor=\"middle\" class=\"fl-text\">lỗi / quá 30 giây, lần 1 → báo thử lại\u003c/text>\n          \u003cpath d=\"M210 572V656\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"198\" y=\"606\" text-anchor=\"end\" class=\"fl-label\">allow, 404 (route chưa có),\u003c/text>\n          \u003ctext x=\"198\" y=\"622\" text-anchor=\"end\" class=\"fl-label\">lỗi từ lần 2 liên tiếp\u003c/text>\n\n          \u003crect x=\"50\" y=\"658\" width=\"320\" height=\"52\" rx=\"10\" class=\"fl-ask\"/>\n          \u003ctext x=\"210\" y=\"680\" text-anchor=\"middle\" class=\"fl-text\">Máy có tín hiệu chặn\u003c/text>\n          \u003ctext x=\"210\" y=\"698\" text-anchor=\"middle\" class=\"fl-text\">và chế độ là enforce?\u003c/text>\n          \u003cpath d=\"M370 684H438\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"404\" y=\"677\" text-anchor=\"middle\" class=\"fl-label\">có\u003c/text>\n          \u003crect x=\"440\" y=\"666\" width=\"300\" height=\"36\" rx=\"10\" class=\"fl-bad\"/>\n          \u003ctext x=\"590\" y=\"689\" text-anchor=\"middle\" class=\"fl-text\">Chặn · thiết bị\u003c/text>\n          \u003cpath d=\"M210 710V734\" class=\"fl-line\" marker-end=\"url(#fl-arrow)\"/>\n          \u003ctext x=\"220\" y=\"728\" class=\"fl-label\">không\u003c/text>\n\n          \u003crect x=\"50\" y=\"736\" width=\"320\" height=\"44\" rx=\"10\" class=\"fl-ok\"/>\n          \u003ctext x=\"210\" y=\"763\" text-anchor=\"middle\" class=\"fl-strong\">StoreKit → verify/apple → cộng Kazh\u003c/text>\n        \u003c/svg>\n      \u003c/div>\n      \u003cdiv class=\"legend\">\n        \u003cspan class=\"chip bad\">Đỏ: chặn, sheet hiện thông báo\u003c/span>\n        \u003cspan class=\"chip warn\">Vàng: chờ thêm hoặc báo thử lại\u003c/span>\n        \u003cspan class=\"chip ok\">Xanh: mở StoreKit\u003c/span>\n        \u003cspan class=\"chip neutral\">Chế độ = \u003ccode>client_integrity_mode\u003c/code> của server, không có thì Remote Config\u003c/span>\n      \u003c/div>\n      \u003cp class=\"sub\">Chi tiết từng bước:\u003c/p>\n      \u003col class=\"steps\">\n        \u003cli class=\"step\">\n          \u003cdiv>\n            \u003ch3>Screen Time hoặc MDM, rồi công tắc Remote Config\u003c/h3>\n            \u003cp>Máy đang tắt mua hàng trong Screen Time hoặc bởi hồ sơ quản lý thiết bị thì chặn ngay. Remote Config \u003ccode>IOS_IAP_INTEGRITY_MODE\u003c/code> đang \u003ccode>off\u003c/code> thì bỏ qua cả cổng và mở StoreKit.\u003c/p>\n            \u003cdiv class=\"outcomes\">\u003cspan class=\"chip bad\">Chặn · tắt mua hàng\u003c/span>\u003cspan class=\"chip neutral\">Không gửi request\u003c/span>\u003cspan class=\"chip ok\">off → mở StoreKit\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/li>\n        \u003cli class=\"step\">\n          \u003cdiv>\n            \u003ch3>Ký assertion, chờ xong\u003c/h3>\n            \u003cp>Key đã được đăng ký sẵn ở nền (xem mục dưới), nên bước này chỉ xin challenge \u003ccode>assert\u003c/code> rồi ký \u003ccode>client_data\u003c/code> ngay tại máy, không gọi Apple. Nếu bấm Mua mà chưa có key (vừa cài app, việc đăng ký nền chưa xong) thì đăng ký ngay trong lần bấm này. Mac và simulator báo \u003ccode>unsupported\u003c/code>; Apple hay server lỗi thì báo \u003ccode>unavailable\u003c/code> hoặc \u003ccode>failed\u003c/code>. Cả ba trường hợp vẫn sang bước 3 để server quyết.\u003c/p>\n            \u003cdiv class=\"outcomes\">\u003cspan class=\"chip neutral\">Thường dưới 1 giây\u003c/span>\u003cspan class=\"chip neutral\">Chưa có key: chờ thêm vài giây\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/li>\n        \u003cli class=\"step\">\n          \u003cdiv>\n            \u003ch3>Gửi intent, chờ server trả lời\u003c/h3>\n            \u003cp>App gửi \u003ccode>POST /payments/v1/apple/purchase-intents\u003c/code> kèm kết quả App Attest, tín hiệu thiết bị và platform, kể cả khi máy có tín hiệu chặn. \u003ccode>PAYMENT_029\u003c/code> là tài khoản đã được Apple refund (chặn mua, không ban); mã deny khác là thiết bị.\u003c/p>\n            \u003cdiv class=\"outcomes\">\u003cspan class=\"chip bad\">deny → chặn · tài khoản / thiết bị\u003c/span>\u003cspan class=\"chip warn\">Lỗi, quá 30 giây (bước 2–3): lần đầu chặn, báo thử lại\u003c/span>\u003cspan class=\"chip warn\">Từ lần thứ hai liên tiếp → cho mua\u003c/span>\u003cspan class=\"chip neutral\">404 route chưa có → bỏ qua server\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/li>\n        \u003cli class=\"step\">\n          \u003cdiv>\n            \u003ch3>Luật thiết bị\u003c/h3>\n            \u003cp>Máy có tín hiệu chặn (simulator, jailbreak, tweak tiêm vào app, bản re-sign) và chế độ là \u003ccode>enforce\u003c/code> thì chặn. Chế độ lấy từ \u003ccode>client_integrity_mode\u003c/code> của server; không có thì lấy Remote Config \u003ccode>IOS_IAP_INTEGRITY_MODE\u003c/code>.\u003c/p>\n            \u003cdiv class=\"outcomes\">\u003cspan class=\"chip bad\">Chặn · thiết bị\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/li>\n        \u003cli class=\"step buy\">\n          \u003cdiv>\n            \u003ch3>Mua\u003c/h3>\n            \u003cp>StoreKit trừ tiền → \u003ccode>POST /payments/v1/verify/apple\u003c/code> (body không đổi) → cộng Kazh → finish giao dịch.\u003c/p>\n            \u003cdiv class=\"outcomes\">\u003cspan class=\"chip ok\">Mua thành công\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/li>\n      \u003c/ol>\n      \u003cdiv class=\"note\">\n        \u003cp>Với app gốc, StoreKit thường chỉ mở \u003cstrong>sau\u003c/strong> khi server đã trả lời. Charge không có intent được trả lời chỉ đến từ ba trường hợp: các lần bấm từ lần thứ hai trở đi trong một chuỗi server không trả lời, Remote Config \u003ccode>off\u003c/code>, và route intent trả \u003ccode>404\u003c/code> (iOS bỏ qua route đó tới lần mở app sau). Intent của một lần bấm đã hết giờ vẫn có thể tới server muộn, kể cả sau charge. Lỗi kiểu \"báo thử lại\" không khoá sheet: user bấm Mua lại được ngay.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"goi-api\">\n      \u003ch2>Ai gọi ai\u003c/h2>\n      \u003cp class=\"sub\">Mọi lời gọi giữa app, server Kazoom và Apple, theo đúng thứ tự. Ô viền xanh là việc server phải làm. Đường dẫn viết tắt: \u003ccode>…/challenge\u003c/code> và \u003ccode>…/keys\u003c/code> nằm dưới \u003ccode>/devices/v1/app-attest\u003c/code>, \u003ccode>…/purchase-intents\u003c/code> dưới \u003ccode>/payments/v1/apple\u003c/code>, \u003ccode>…/verify/apple\u003c/code> dưới \u003ccode>/payments/v1\u003c/code>.\u003c/p>\n      \u003cdiv class=\"diagram\">\n        \u003csvg viewBox=\"0 0 760 858\" role=\"img\" aria-label=\"Sơ đồ các lời gọi giữa App Kazoom, Server Kazoom và Apple: đăng ký key chạy nền, lúc bấm Mua xin challenge, ký assertion, gửi purchase intent và chờ quyết định, rồi mới mua qua StoreKit\">\n          \u003cdefs>\u003cmarker id=\"sq-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10z\" class=\"fl-head\"/>\u003c/marker>\u003c/defs>\n          \u003crect x=\"8\" y=\"58\" width=\"744\" height=\"288\" rx=\"10\" class=\"sq-band\"/>\n          \u003crect x=\"8\" y=\"356\" width=\"744\" height=\"278\" rx=\"10\" class=\"sq-band\"/>\n          \u003crect x=\"8\" y=\"644\" width=\"744\" height=\"202\" rx=\"10\" class=\"sq-band\"/>\n          \u003cpath d=\"M110 46V854\" class=\"sq-life\"/>\n          \u003cpath d=\"M400 46V854\" class=\"sq-life\"/>\n          \u003cpath d=\"M650 46V854\" class=\"sq-life\"/>\n          \u003crect x=\"25\" y=\"10\" width=\"170\" height=\"36\" rx=\"18\" class=\"fl-start\"/>\n          \u003ctext x=\"110\" y=\"33\" text-anchor=\"middle\" class=\"fl-start-text\">App Kazoom\u003c/text>\n          \u003crect x=\"315\" y=\"10\" width=\"170\" height=\"36\" rx=\"18\" class=\"fl-start\"/>\n          \u003ctext x=\"400\" y=\"33\" text-anchor=\"middle\" class=\"fl-start-text\">Server Kazoom\u003c/text>\n          \u003crect x=\"565\" y=\"10\" width=\"170\" height=\"36\" rx=\"18\" class=\"fl-start\"/>\n          \u003ctext x=\"650\" y=\"33\" text-anchor=\"middle\" class=\"fl-start-text\">Apple\u003c/text>\n          \u003ctext x=\"22\" y=\"79\" class=\"sq-title\">① Chạy nền sau khi đăng nhập · mỗi tài khoản trên mỗi máy một lần · không chặn gì\u003c/text>\n          \u003ctext x=\"22\" y=\"377\" class=\"sq-title\">② Bấm Mua · user chờ, tối đa 30 giây · chưa có key thì chạy ① ngay tại đây\u003c/text>\n          \u003ctext x=\"22\" y=\"665\" class=\"sq-title\">③ Mua · như hiện nay\u003c/text>\n          \u003crect x=\"33\" y=\"102\" width=\"154\" height=\"24\" rx=\"7\" class=\"fl-node\"/>\n          \u003ctext x=\"110\" y=\"118\" text-anchor=\"middle\" class=\"sq-note\">generateKey() → keyId\u003c/text>\n          \u003cpath d=\"M110 150H398\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"144\" text-anchor=\"middle\" class=\"sq-msg\">POST …/challenge · purpose: attest\u003c/text>\n          \u003cpath d=\"M400 180H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"174\" text-anchor=\"middle\" class=\"sq-msg\">challenge\u003c/text>\n          \u003cpath d=\"M110 210H648\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"380\" y=\"204\" text-anchor=\"middle\" class=\"sq-msg\">attestKey(keyId, SHA256(challenge))\u003c/text>\n          \u003cpath d=\"M650 240H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"380\" y=\"234\" text-anchor=\"middle\" class=\"sq-msg\">attestation (CBOR)\u003c/text>\n          \u003cpath d=\"M110 270H398\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"264\" text-anchor=\"middle\" class=\"sq-msg\">POST …/keys · attestation\u003c/text>\n          \u003crect x=\"293\" y=\"286\" width=\"214\" height=\"24\" rx=\"7\" class=\"fl-ask\"/>\n          \u003ctext x=\"400\" y=\"302\" text-anchor=\"middle\" class=\"sq-note\">verify 11 bước · lưu public key\u003c/text>\n          \u003cpath d=\"M400 334H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"328\" text-anchor=\"middle\" class=\"sq-msg\">200\u003c/text>\n          \u003cpath d=\"M110 414H398\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"408\" text-anchor=\"middle\" class=\"sq-msg\">POST …/challenge · purpose: assert\u003c/text>\n          \u003cpath d=\"M400 444H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"438\" text-anchor=\"middle\" class=\"sq-msg\">challenge (một lần, khoảng 5 phút)\u003c/text>\n          \u003crect x=\"14\" y=\"460\" width=\"250\" height=\"24\" rx=\"7\" class=\"fl-node\"/>\n          \u003ctext x=\"139\" y=\"476\" text-anchor=\"middle\" class=\"sq-note\">ký assertion tại máy, không gọi Apple\u003c/text>\n          \u003cpath d=\"M110 508H398\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"502\" text-anchor=\"middle\" class=\"sq-msg\">POST …/purchase-intents\u003c/text>\n          \u003crect x=\"275\" y=\"524\" width=\"250\" height=\"40\" rx=\"7\" class=\"fl-ask\"/>\n          \u003ctext x=\"400\" y=\"540\" text-anchor=\"middle\" class=\"sq-note\">verify assertion · cờ refund · policy\u003c/text>\n          \u003ctext x=\"400\" y=\"556\" text-anchor=\"middle\" class=\"sq-note\">lưu intent → allow hoặc deny\u003c/text>\n          \u003cpath d=\"M400 588H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"582\" text-anchor=\"middle\" class=\"sq-msg\">decision + client_integrity_mode\u003c/text>\n          \u003crect x=\"14\" y=\"604\" width=\"238\" height=\"24\" rx=\"7\" class=\"fl-node\"/>\n          \u003ctext x=\"133\" y=\"620\" text-anchor=\"middle\" class=\"sq-note\">deny → chặn · allow → luật thiết bị\u003c/text>\n          \u003cpath d=\"M110 702H648\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"380\" y=\"696\" text-anchor=\"middle\" class=\"sq-msg\">StoreKit purchase() · trừ tiền\u003c/text>\n          \u003cpath d=\"M650 732H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"380\" y=\"726\" text-anchor=\"middle\" class=\"sq-msg\">giao dịch đã ký (JWS)\u003c/text>\n          \u003cpath d=\"M110 762H398\" class=\"fl-line\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"756\" text-anchor=\"middle\" class=\"sq-msg\">POST …/verify/apple · body không đổi\u003c/text>\n          \u003crect x=\"305\" y=\"778\" width=\"190\" height=\"24\" rx=\"7\" class=\"fl-ask\"/>\n          \u003ctext x=\"400\" y=\"794\" text-anchor=\"middle\" class=\"sq-note\">ghép với intent · cộng Kazh\u003c/text>\n          \u003cpath d=\"M400 826H112\" class=\"sq-ret\" marker-end=\"url(#sq-arrow)\"/>\n          \u003ctext x=\"255\" y=\"820\" text-anchor=\"middle\" class=\"sq-msg\">200 → finish giao dịch\u003c/text>\n        \u003c/svg>\n      \u003c/div>\n      \u003cdiv class=\"legend\">\n        \u003cspan class=\"chip neutral\">Mũi tên liền: gọi\u003c/span>\n        \u003cspan class=\"chip neutral\">Mũi tên nét đứt: trả lời\u003c/span>\n        \u003cspan class=\"chip neutral\">Ô viền xanh: việc của server\u003c/span>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"dang-ky\">\n      \u003ch2>Đăng ký key: chạy nền, ngoài luồng mua\u003c/h2>\n      \u003cp class=\"sub\">Theo Apple, attest key nên chạy nền, ngoài thao tác của user. Kazoom đăng ký sau khi đăng nhập, hoặc khi mở app mà tài khoản chưa có key, và chỉ khi Mua Kazh đang bật và Remote Config không ở \u003ccode>off\u003c/code>. Mỗi tài khoản trên mỗi máy chỉ đăng ký một lần. Việc này không kiểm tra hay chặn gì cả.\u003c/p>\n      \u003col class=\"strip\">\n        \u003cli>\u003cspan class=\"label\">Bước 1 · trên máy\u003c/span>\u003ch3>Tạo key\u003c/h3>\u003cp>\u003ccode>generateKey()\u003c/code> trong Secure Enclave → \u003ccode>keyId\u003c/code>, lưu vào file không backup.\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"label\">Bước 2 · backend\u003c/span>\u003ch3>Xin challenge\u003c/h3>\u003cp>\u003ccode>POST /devices/v1/app-attest/challenge\u003c/code> với \u003ccode>purpose: \"attest\"\u003c/code>.\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"label\">Bước 3 · Apple\u003c/span>\u003ch3>Apple chứng nhận\u003c/h3>\u003cp>\u003ccode>attestKey(keyId, SHA256(challenge))\u003c/code> → attestation (CBOR).\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"label\">Bước 4 · backend\u003c/span>\u003ch3>Gửi key\u003c/h3>\u003cp>\u003ccode>POST /devices/v1/app-attest/keys\u003c/code> → server verify, lưu public key → \u003ccode>200\u003c/code>.\u003c/p>\u003c/li>\n      \u003c/ol>\n      \u003cdiv class=\"note\" style=\"margin-top:12px\">\n        \u003cp>Lỗi thì để lần sau (lần đăng nhập, mở app hay bấm Mua kế tiếp), không có vòng retry và không làm phiền user. Nếu tới lúc bấm Mua vẫn chưa có key, app đăng ký ngay trong lần bấm đó (user chờ thêm vài giây), nên intent luôn mang kết quả App Attest thật. Mỗi bước ghi file ngay khi xong, lỗi giữa chừng thì lần sau làm tiếp từ bước đó. Hai lần đăng ký không bao giờ chạy chồng nhau.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"backend\">\n      \u003ch2>Backend cần làm: 3 endpoint\u003c/h2>\n      \u003cp class=\"sub\">Đều cần JWT. Không đổi route nào đang có.\u003c/p>\n      \u003cul class=\"rules\">\n        \u003cli>\u003cstrong>Envelope bắt buộc.\u003c/strong> Thành công là \u003ccode>{\"success\": true, \"data\": {…}}\u003c/code>; lỗi là HTTP 4xx/5xx kèm \u003ccode>{\"success\": false, \"code\", \"message\"}\u003c/code>. iOS coi JSON phẳng hay \u003ccode>success: false\u003c/code> là lỗi, nên một deny trả sai envelope sẽ bị bỏ qua.\u003c/li>\n        \u003cli>\u003cstrong>404 trần là \"chưa deploy\".\u003c/strong> 404 không có \u003ccode>code\u003c/code> hoặc \u003ccode>code\u003c/code> là \u003ccode>NOT_FOUND\u003c/code> làm iOS bỏ qua route đó đến hết phiên. Lỗi nghiệp vụ không bao giờ trả 404 trần.\u003c/li>\n        \u003cli>\u003cstrong>Schema Huma.\u003c/strong> Body và mọi struct lồng có \u003ccode>additionalProperties:\"true\"\u003c/code>, field tuỳ chọn có \u003ccode>omitempty\u003c/code>, \u003ccode>integrity_signals\u003c/code> là \u003ccode>[]string\u003c/code> không khai enum, tối đa 32 phần tử.\u003c/li>\n        \u003cli>\u003cstrong>Không thêm field vào \u003ccode>verify/apple\u003c/code>.\u003c/strong> Server tự ghép intent với charge.\u003c/li>\n      \u003c/ul>\n\n      \u003carticle class=\"endpoint\">\n        \u003cheader>\n          \u003cspan class=\"method\">POST\u003c/span>\u003cspan class=\"path\">/devices/v1/app-attest/challenge\u003c/span>\n          \u003cp class=\"purpose\">Cấp challenge dùng một lần cho bước attest hoặc assert.\u003c/p>\n        \u003c/header>\n        \u003cdiv class=\"body\">\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">Request\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{ \"purpose\": \"attest\" }\u003c/pre>\u003c/div>\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">Response\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{ \"success\": true, \"data\": { \"challenge\": \"q3V0b2tlbi1yYW5kb20tMTYtYnl0ZXM\", \"expires_at\": \"2026-10-06T10:05:00Z\" } }\u003c/pre>\u003c/div>\n          \u003cul class=\"plain\">\n            \u003cli>Tối thiểu 16 byte ngẫu nhiên, mã hoá base64url, gắn với user của JWT.\u003c/li>\n            \u003cli>\u003ccode>attest\u003c/code>: không nên hết hạn trước khi \u003ccode>/keys\u003c/code> thành công. iOS không đọc \u003ccode>expires_at\u003c/code> và có thể gửi lại sau nhiều ngày. Hết hạn thì trả \u003ccode>ATTEST_002\u003c/code>.\u003c/li>\n            \u003cli>\u003ccode>assert\u003c/code>: dùng một lần, sống khoảng 5 phút.\u003c/li>\n            \u003cli>Trả \u003ccode>503\u003c/code> khi cần kéo lùi: iOS gửi intent với \u003ccode>status: \"unavailable\"\u003c/code> và không gọi Apple.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/article>\n\n      \u003carticle class=\"endpoint\">\n        \u003cheader>\n          \u003cspan class=\"method\">POST\u003c/span>\u003cspan class=\"path\">/devices/v1/app-attest/keys\u003c/span>\n          \u003cp class=\"purpose\">Nhận attestation, verify và lưu public key của máy.\u003c/p>\n        \u003c/header>\n        \u003cdiv class=\"body\">\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">Request\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{\n  \"key_id\": \"&lt;base64, 32 byte&gt;\",\n  \"attestation\": \"&lt;base64 của attestation object CBOR&gt;\",\n  \"challenge\": \"&lt;challenge attest đã cấp&gt;\"\n}\u003c/pre>\u003c/div>\n          \u003cdiv class=\"table-wrap\">\n            \u003ctable>\n              \u003cthead>\u003ctr>\u003cth>HTTP\u003c/th>\u003cth>Khi nào\u003c/th>\u003cth>iOS làm gì\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003ctr>\u003ctd class=\"nowrap\">\u003ccode>200\u003c/code> / \u003ccode>204\u003c/code>\u003c/td>\u003ctd>Verify xong, hoặc key đã đăng ký cho chính user này (idempotent)\u003c/td>\u003ctd>Dùng key để assert\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd class=\"nowrap\">\u003ccode>409\u003c/code>\u003c/td>\u003ctd>Key đã thuộc user khác\u003c/td>\u003ctd>Bỏ key\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd class=\"nowrap\">\u003ccode>422\u003c/code> + \u003ccode>ATTEST_0xx\u003c/code>\u003c/td>\u003ctd>Attestation sai, challenge sai hoặc hết hạn\u003c/td>\u003ctd>Bỏ key, tạo key mới sau tối đa 24 giờ\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd class=\"nowrap\">\u003ccode>5xx\u003c/code> / \u003ccode>429\u003c/code>\u003c/td>\u003ctd>Lỗi tạm thời\u003c/td>\u003ctd>Giữ key, gửi lại y nguyên ở lần sau (đăng nhập, mở app hay bấm Mua kế tiếp)\u003c/td>\u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp style=\"margin:0;color:var(--muted);font-size:14px\">Gợi ý mã (iOS chỉ đọc prefix \u003ccode>ATTEST_\u003c/code>): \u003ccode>ATTEST_001\u003c/code> attestation không hợp lệ · \u003ccode>ATTEST_002\u003c/code> challenge sai, hết hạn hoặc đã dùng · \u003ccode>ATTEST_003\u003c/code> App ID hoặc môi trường không được chấp nhận.\u003c/p>\n        \u003c/div>\n      \u003c/article>\n\n      \u003carticle class=\"endpoint\">\n        \u003cheader>\n          \u003cspan class=\"method\">POST\u003c/span>\u003cspan class=\"path\">/payments/v1/apple/purchase-intents\u003c/span>\n          \u003cp class=\"purpose\">Câu trả lời của server ở bước 2–4 của luồng bấm Mua.\u003c/p>\n        \u003c/header>\n        \u003cdiv class=\"body\">\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">Request\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{\n  \"product_id\": \"ai.kazoom.ios.stars_50\",\n  \"attestation\": {\n    \"status\": \"ok\",\n    \"key_id\": \"&lt;base64&gt;\",\n    \"client_data\": \"&lt;base64 của JSON đã ký&gt;\",\n    \"assertion\": \"&lt;base64 của assertion CBOR&gt;\"\n  },\n  \"platform\": { \"is_ios_app_on_mac\": false, \"is_ios_app_on_vision\": false },\n  \"integrity_signals\": [],\n  \"app_transaction_jws\": \"&lt;JWS, chỉ build Release, có thể vắng&gt;\",\n  \"device_check_token\": \"&lt;base64&gt;\"\n}\u003c/pre>\u003c/div>\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">\u003ccode>client_data\u003c/code> sau khi decode (key sắp xếp)\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{\"action\":\"apple_topup\",\"challenge\":\"&lt;challenge assert&gt;\",\"product_id\":\"ai.kazoom.ios.stars_50\",\"user_id\":\"&lt;user id&gt;\"}\u003c/pre>\u003c/div>\n          \u003cdiv class=\"code\">\u003cspan class=\"label\">Response · luôn 200, kể cả khi deny\u003c/span>\u003cbutton class=\"copy\" type=\"button\">Copy\u003c/button>\u003cpre>{ \"success\": true, \"data\": { \"decision\": \"deny\", \"reason_code\": \"PAYMENT_028\", \"intent_id\": \"pi_01J…\", \"client_integrity_mode\": \"enforce\" } }\u003c/pre>\u003c/div>\n          \u003cdiv class=\"table-wrap\">\n            \u003ctable>\n              \u003cthead>\u003ctr>\u003cth>Câu trả lời\u003c/th>\u003cth>iOS làm gì\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003ctr>\u003ctd>\u003ccode>allow\u003c/code>\u003c/td>\u003ctd>Đi tiếp tới luật thiết bị, rồi mở StoreKit\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>\u003ccode>decision\u003c/code> khác \u003ccode>deny\u003c/code> (rỗng, giá trị lạ, khác hoa/thường)\u003c/td>\u003ctd>Coi như \u003ccode>allow\u003c/code>: chỉ đúng chuỗi \u003ccode>deny\u003c/code> mới chặn\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>\u003ccode>deny\u003c/code> + \u003ccode>PAYMENT_029\u003c/code>\u003c/td>\u003ctd>“Tài khoản này không thể mua Kazh”, tắt nút Mua\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>\u003ccode>deny\u003c/code> + \u003ccode>PAYMENT_028\u003c/code> hoặc mã khác\u003c/td>\u003ctd>“Không thể mua trên thiết bị này”, tắt nút Mua\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>\u003ccode>403\u003c/code> kèm \u003ccode>PAYMENT_028\u003c/code> / \u003ccode>029\u003c/code>\u003c/td>\u003ctd>Cũng coi là deny (phòng thủ)\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>Lỗi mạng, \u003ccode>5xx\u003c/code>, quá 30 giây\u003c/td>\u003ctd>Lần đầu: chặn, báo “thử lại”, nút Mua vẫn bấm lại được. Từ lần thứ hai liên tiếp: cho mua; đối soát sẽ thấy charge này không có intent\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>\u003ccode>404\u003c/code> không code hoặc \u003ccode>NOT_FOUND\u003c/code>\u003c/td>\u003ctd>Bỏ qua server: route chưa deploy\u003c/td>\u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cul class=\"plain\">\n            \u003cli>\u003ccode>client_integrity_mode\u003c/code> (\u003ccode>enforce\u003c/code> | \u003ccode>report\u003c/code> | \u003ccode>off\u003c/code>) quyết luật thiết bị cho \u003cstrong>đúng lần bấm đó\u003c/strong>: \u003ccode>report\u003c/code> hoặc \u003ccode>off\u003c/code> cho máy có tín hiệu chặn mua tiếp.\u003c/li>\n            \u003cli>\u003ccode>status\u003c/code> là \u003ccode>ok\u003c/code> | \u003ccode>unsupported\u003c/code> | \u003ccode>unavailable\u003c/code> | \u003ccode>failed\u003c/code>. \u003ccode>client_data\u003c/code> và \u003ccode>assertion\u003c/code> chỉ có khi \u003ccode>ok\u003c/code>; \u003ccode>key_id\u003c/code> chỉ có khi key đã đăng ký xong. Field tuỳ chọn bị bỏ hẳn khi không có giá trị.\u003c/li>\n            \u003cli>Tên tín hiệu: \u003ccode>simulator\u003c/code>, \u003ccode>jailbreak_root\u003c/code>, \u003ccode>injected_library\u003c/code>, \u003ccode>foreign_signer\u003c/code>, \u003ccode>foreign_bundle_code\u003c/code>, \u003ccode>debugger\u003c/code>, \u003ccode>dyld_insert_env\u003c/code>.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/article>\n    \u003c/section>\n\n    \u003csection id=\"verify\">\n      \u003ch2>Verify App Attest\u003c/h2>\n      \u003cp class=\"sub\">Làm đúng tài liệu Apple: 11 bước khi nhận \u003ccode>/keys\u003c/code>, 8 bước ở mỗi intent. Bảng dưới là phần riêng của Kazoom.\u003c/p>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Mục\u003c/th>\u003cth>Giá trị của Kazoom\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd class=\"k\">App ID (\u003ccode>rpIdHash\u003c/code>)\u003c/td>\u003ctd>\u003ccode>8D93PN23NR.ai.kazoom.ios\u003c/code> cho production, \u003ccode>8D93PN23NR.ai.kazoom.ios.stg\u003c/code> cho staging\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>clientDataHash\u003c/code> lúc attest\u003c/td>\u003ctd>SHA256 của byte UTF-8 của chuỗi challenge, đúng như server đã gửi (không decode base64)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>client_data\u003c/code> lúc assert\u003c/td>\u003ctd>Băm đúng các byte nhận được. \u003ccode>action\u003c/code> = \u003ccode>apple_topup\u003c/code>, \u003ccode>product_id\u003c/code> khớp body, \u003ccode>user_id\u003c/code> khớp \u003ccode>sub\u003c/code> của JWT, \u003ccode>challenge\u003c/code> là challenge \u003ccode>assert\u003c/code> chưa dùng\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>counter\u003c/code>\u003c/td>\u003ctd>\u003ccode>0\u003c/code> lúc attest; mỗi assertion phải lớn hơn giá trị đã lưu. Có thể nhảy cóc (lần bấm bị huỷ sau khi đã ký); iOS không ký hay gửi gì sau khi lần bấm hết 30 giây. Xem bẫy “Intent trễ” bên dưới\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">Môi trường\u003c/td>\u003ctd>Theo \u003ccode>aaguid\u003c/code> của từng attestation: \u003ccode>appattest\u003c/code> + 7 byte \u003ccode>0x00\u003c/code> là production, \u003ccode>appattestdevelop\u003c/code> / \u003ccode>appattestsandbox\u003c/code> là development. Lưu theo key\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">Key đã thuộc user khác\u003c/td>\u003ctd>Trả \u003ccode>409\u003c/code>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">Lưu sau khi verify\u003c/td>\u003ctd>Public key, receipt, \u003ccode>sign_count\u003c/code>, môi trường, \u003ccode>apple_validation_category_01\u003c/code>, \u003ccode>apple_bundle_version_01\u003c/code>\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003ch3 style=\"margin-top:24px\">Bẫy đã biết\u003c/h3>\n      \u003cdiv class=\"traps\">\n        \u003cdiv class=\"trap\">\u003cp>\u003cstrong>Không dựng lại JSON để băm.\u003c/strong> iOS tạo \u003ccode>client_data\u003c/code> bằng \u003ccode>JSONSerialization\u003c/code> (key sắp xếp), vốn escape \u003ccode>/\u003c/code> thành \u003ccode>\\/\u003c/code>. Cấp challenge dạng base64url hoặc hex cho gọn.\u003c/p>\u003c/div>\n        \u003cdiv class=\"trap\">\u003cp>\u003cstrong>Mẫu của Apple băm challenge dạng raw bytes\u003c/strong>, còn code thật theo iOS (byte UTF-8 của chuỗi). Cert lá trong mẫu đã hết hạn 23/04/2026, nên test phải cố định thời điểm verify (ví dụ 21/04/2026).\u003c/p>\u003c/div>\n        \u003cdiv class=\"trap\">\u003cp>\u003cstrong>Cờ ED của \u003ccode>authData\u003c/code> có thể không bật\u003c/strong> dù vẫn có map \u003ccode>extensions\u003c/code>. Parse phần byte còn lại sau public key, đừng dựa vào cờ.\u003c/p>\u003c/div>\n        \u003cdiv class=\"trap\">\u003cp>\u003cstrong>Receipt có thể cũ hơn 5 phút\u003c/strong>, vì iOS gửi lại attestation đã cache sau một lần \u003ccode>/keys\u003c/code> lỗi. Chỉ gắn cờ, không từ chối key vì lý do này.\u003c/p>\u003c/div>\n        \u003cdiv class=\"trap\">\u003cp>\u003cstrong>Intent trễ không phải replay.\u003c/strong> Request đã gửi trước hạn 30 giây vẫn có thể được xử lý sau intent của lần bấm mới hơn, nên mang counter thấp hơn. Challenge \u003ccode>assert\u003c/code> của nó hợp lệ và chưa dùng: chỉ cần không nhận chính request đó, đừng gắn cờ tài khoản. Replay thật thì dùng lại challenge đã dùng.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"policy\">\n      \u003ch2>Policy\u003c/h2>\n      \u003cp class=\"sub\">Chạy \u003ccode>monitor\u003c/code> trước; sau 1–2 bản iOS mới chuyển \u003ccode>enforce\u003c/code>.\u003c/p>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Trường hợp\u003c/th>\u003cth>monitor\u003c/th>\u003cth>enforce\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>User hoặc \u003ccode>appTransactionId\u003c/code> bị cờ refund\u003c/td>\u003ctd>\u003cspan class=\"chip bad\">deny 029\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip bad\">deny 029\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Assertion hợp lệ\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">allow\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">allow\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Assertion sai, hoặc replay\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip bad\">deny 028\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003ccode>unsupported\u003c/code> trên Mac\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + giới hạn\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003ccode>unsupported\u003c/code> từ iPhone/iPad\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag + hold dài\u003c/span> \u003cspan class=\"chip neutral\">đã chốt\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003ccode>unavailable\u003c/code> / \u003ccode>failed\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip warn\">allow + flag\u003c/span>\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cdiv class=\"note\" style=\"margin-top:12px\">\n        \u003cp>Tín hiệu thiết bị (\u003ccode>integrity_signals\u003c/code>) do app tự chặn theo chế độ. Server chỉ gửi \u003ccode>client_integrity_mode\u003c/code> khi cố ý: \u003ccode>\"report\"\u003c/code> để gỡ một lần chặn nhầm, \u003ccode>\"enforce\"\u003c/code> để chặn dù Remote Config đang nới. Theo Apple, App Attest lỗi thì giảm chức năng và theo dõi thêm, đừng chặn thẳng khi chưa đánh giá rủi ro.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"van-hanh\">\n      \u003ch2>Lưu trữ, đối soát và kéo lùi\u003c/h2>\n      \u003ch3>Ba bảng mới\u003c/h3>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Bảng\u003c/th>\u003cth>Cột\u003c/th>\u003cth>Ghi chú\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>device_attest_keys\u003c/code>\u003c/td>\u003ctd>\u003ccode>key_id\u003c/code> (unique), \u003ccode>user_id\u003c/code>, \u003ccode>public_key\u003c/code>, \u003ccode>sign_count\u003c/code>, \u003ccode>environment\u003c/code>, \u003ccode>category\u003c/code>, \u003ccode>bundle_version\u003c/code>, \u003ccode>receipt\u003c/code>, \u003ccode>attested_at\u003c/code>, \u003ccode>last_assertion_at\u003c/code>, \u003ccode>revoked_at\u003c/code>\u003c/td>\u003ctd>Một user nhiều key, mỗi máy một key\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>app_attest_challenges\u003c/code>\u003c/td>\u003ctd>\u003ccode>challenge\u003c/code> (PK), \u003ccode>user_id\u003c/code>, \u003ccode>purpose\u003c/code>, \u003ccode>expires_at\u003c/code>, \u003ccode>used_at\u003c/code>\u003c/td>\u003ctd>Redis có TTL cũng được\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>payment_purchase_intents\u003c/code>\u003c/td>\u003ctd>\u003ccode>id\u003c/code>, \u003ccode>user_id\u003c/code>, \u003ccode>product_id\u003c/code>, \u003ccode>key_id\u003c/code>, \u003ccode>attestation_status\u003c/code>, \u003ccode>signals\u003c/code>, \u003ccode>platform\u003c/code>, \u003ccode>decision\u003c/code>, \u003ccode>reason\u003c/code>, \u003ccode>created_at\u003c/code>\u003c/td>\u003ctd>Ghi mọi intent, kể cả intent đến muộn\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003ch3 style=\"margin-top:24px\">Đối soát intent với charge\u003c/h3>\n      \u003cul class=\"plain\">\n        \u003cli>Khi cộng Kazh (\u003ccode>verify/apple\u003c/code> hoặc webhook \u003ccode>ONE_TIME_CHARGE\u003c/code>), tìm intent \u003ccode>allow\u003c/code> cùng \u003ccode>(user_id, product_id)\u003c/code> từ 30 phút trước tới 5 phút sau \u003ccode>purchaseDate\u003c/code> (intent của lần bấm đã hết giờ có thể tới sau charge). Có thì charge là attested, không có thì unattested.\u003c/li>\n        \u003cli>Kết quả chỉ dùng cho hold và ngưỡng rủi ro, \u003cstrong>không bao giờ\u003c/strong> để từ chối cộng Kazh.\u003c/li>\n        \u003cli>Chiều ngược lại thì bình thường: intent \u003ccode>allow\u003c/code> không có charge theo sau là user đã huỷ ở App Store, đóng sheet trong lúc chờ (iOS huỷ lần bấm đó và không mở App Store), hoặc iOS chặn theo luật thiết bị sau khi server allow.\u003c/li>\n      \u003c/ul>\n      \u003ch3 style=\"margin-top:24px\">Kéo lùi khi có sự cố\u003c/h3>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Công tắc\u003c/th>\u003cth>Tác dụng\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>APP_ATTEST_MODE\u003c/code>\u003c/td>\u003ctd>\u003ccode>off\u003c/code> | \u003ccode>monitor\u003c/code> | \u003ccode>enforce\u003c/code>, config server\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">Challenge trả \u003ccode>503\u003c/code>\u003c/td>\u003ctd>iOS gửi \u003ccode>unavailable\u003c/code> và không gọi Apple\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">\u003ccode>client_integrity_mode: \"report\"\u003c/code>\u003c/td>\u003ctd>Gỡ chặn thiết bị ngay ở lần bấm Mua đó\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd class=\"k\">Remote Config \u003ccode>IOS_IAP_INTEGRITY_MODE\u003c/code>\u003c/td>\u003ctd>\u003ccode>report\u003c/code>: không chặn theo tín hiệu thiết bị. \u003ccode>off\u003c/code>: tắt toàn bộ cổng, không App Attest, không intent; dùng khi endpoint gặp sự cố\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cp style=\"margin-top:12px;color:var(--muted);font-size:14.5px\">Tải lên Apple: mỗi tài khoản trên mỗi máy chỉ attest một lần, chạy nền sau khi đăng nhập hoặc mở app, khi Mua Kazh đang bật. Lượt đầu là mọi tài khoản đã đăng nhập mở app sau khi bản này lên. Apple khuyên gọi \u003ccode>attestKey\u003c/code> dưới 100 lần mỗi giây trên toàn bộ máy và nâng dần (tối đa 10 triệu user mỗi ngày), nên phased release của App Store là đủ.\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"ios\">\n      \u003ch2>iOS xử lý lỗi thế nào\u003c/h2>\n      \u003cp class=\"sub\">Những gì backend sẽ thấy trong \u003ccode>attestation.status\u003c/code>.\u003c/p>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>\u003ccode>status\u003c/code>\u003c/th>\u003cth>Nghĩa là\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>\u003cspan class=\"chip ok\">ok\u003c/span>\u003c/td>\u003ctd>Có assertion hợp lệ để verify\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003cspan class=\"chip neutral\">unsupported\u003c/span>\u003c/td>\u003ctd>Mac, simulator. Trên iPhone/iPad thật thì hiếm, có thể là tweak giả\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003cspan class=\"chip warn\">unavailable\u003c/span>\u003c/td>\u003ctd>Apple hoặc server tạm lỗi khi xin challenge hay đăng ký key, hoặc route chưa có\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003cspan class=\"chip warn\">failed\u003c/span>\u003c/td>\u003ctd>Key hỏng, đang chờ key mới (tối đa 24 giờ), nên chưa phải bằng chứng gian lận\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cul class=\"plain\" style=\"margin-top:14px\">\n        \u003cli>\u003cstrong>Bỏ key\u003c/strong> khi \u003ccode>attestKey\u003c/code> lỗi (trừ \u003ccode>serverUnavailable\u003c/code>), khi assertion báo \u003ccode>invalidKey\u003c/code> (restore, cài lại app), hoặc khi \u003ccode>/keys\u003c/code> trả \u003ccode>409\u003c/code> hay \u003ccode>ATTEST_*\u003c/code>. Key mới tối đa một lần mỗi 24 giờ, vì mỗi key làm tăng risk metric của máy (đếm trong 30 ngày, không reset được).\u003c/li>\n        \u003cli>\u003cstrong>Giữ key, gửi lại y nguyên\u003c/strong> khi \u003ccode>5xx\u003c/code>, \u003ccode>429\u003c/code> hay timeout. Challenge và attestation được cache, nên có thể tới \u003ccode>/keys\u003c/code> sau nhiều ngày.\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"ke-hoach\" class=\"plan\">\n      \u003ch2>Kế hoạch\u003c/h2>\n      \u003cp class=\"sub\">iOS đã code xong theo luồng chốt và build, test đều pass; chưa mở PR. Backend chưa bắt đầu.\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"card\">\n          \u003ch3>\u003cspan class=\"dot ok\">\u003c/span>iOS · đã code, chưa mở PR\u003c/h3>\n          \u003cul>\n            \u003cli>Bỏ kiểm tra khi mở sheet, bỏ endpoint \u003ccode>eligibility\u003c/code>, gom về một cổng lúc bấm Mua.\u003c/li>\n            \u003cli>Đăng ký key chạy nền sau khi đăng nhập (khi Mua Kazh bật); bấm Mua mà chưa có key thì đăng ký ngay.\u003c/li>\n            \u003cli>Lúc bấm Mua: assertion rồi intent, tuần tự, chờ server trả lời, tối đa 30 giây cho cả hai bước.\u003c/li>\n            \u003cli>Server lỗi: lần đầu chặn và báo thử lại, từ lần thứ hai liên tiếp cho mua; \u003ccode>404\u003c/code> thì bỏ qua; Remote Config \u003ccode>off\u003c/code> tắt cả cổng.\u003c/li>\n            \u003cli>Trong lúc chờ: lưới gói bị khoá, không vuốt đóng được; bấm đóng thì huỷ lần bấm ngay, App Store không mở. Lần bấm quá 30 giây không ký hay gửi gì thêm, và không bị tính là “server không trả lời” nếu user đã đóng sheet.\u003c/li>\n            \u003cli>Đăng ký key nền dừng ngay nếu user đổi tài khoản hay đăng xuất giữa chừng, nên key không bị gắn nhầm tài khoản.\u003c/li>\n            \u003cli>Màn dev có thêm lựa chọn “No answer” (chờ đủ 30 giây như server không trả lời); thêm test và chuỗi mới ở đủ 10 ngôn ngữ.\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3>\u003cspan class=\"dot bad\">\u003c/span>Backend · cần làm, theo thứ tự\u003c/h3>\n          \u003col>\n            \u003cli>\u003ccode>challenge\u003c/code> + \u003ccode>keys\u003c/code> + verify attestation.\u003c/li>\n            \u003cli>\u003ccode>purchase-intents\u003c/code> + verify assertion + policy ở \u003ccode>monitor\u003c/code>.\u003c/li>\n            \u003cli>Cờ refund theo tài khoản → deny \u003ccode>PAYMENT_029\u003c/code>.\u003c/li>\n            \u003cli>Đối soát intent với charge.\u003c/li>\n            \u003cli>Chuyển \u003ccode>enforce\u003c/code> sau 1–2 bản iOS.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n      \u003c/div>\n      \u003cp style=\"margin-top:12px;color:var(--muted);font-size:14.5px\">Các việc backend khác (route tiền legacy trên production, xử lý \u003ccode>REFUND\u003c/code>, consent, hold payout) không đổi, xem \u003ccode>Docs/iap-integrity-refund-backend.md\u003c/code>.\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"checklist\">\n      \u003ch2>Checklist backend\u003c/h2>\n      \u003cp class=\"progress\" id=\"progress\" aria-live=\"polite\">0/9 xong\u003c/p>\n      \u003cul class=\"checklist\" id=\"checklist-items\">\n        \u003cli>\u003clabel for=\"c1\">\u003cinput type=\"checkbox\" id=\"c1\">\u003cspan>Mọi response thành công bọc \u003ccode>{\"success\": true, \"data\": …}\u003c/code>; deny cũng là \u003ccode>success: true\u003c/code>.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c2\">\u003cinput type=\"checkbox\" id=\"c2\">\u003cspan>Verify attestation và assertion qua mẫu của Apple, với thời điểm verify cố định.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c3\">\u003cinput type=\"checkbox\" id=\"c3\">\u003cspan>Máy thật, tài khoản mới: đăng nhập → key được đăng ký ở nền (\u003ccode>/keys\u003c/code> trả 200) → bấm Mua → intent mang \u003ccode>status: \"ok\"\u003c/code>.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c4\">\u003cinput type=\"checkbox\" id=\"c4\">\u003cspan>Gọi lại \u003ccode>/keys\u003c/code> cùng key, cùng user → 200; key của user khác → 409.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c5\">\u003cinput type=\"checkbox\" id=\"c5\">\u003cspan>Gửi lại nguyên body intent cũ (replay) → challenge đã dùng → \u003ccode>monitor\u003c/code>: allow + flag.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c6\">\u003cinput type=\"checkbox\" id=\"c6\">\u003cspan>Challenge trả \u003ccode>503\u003c/code> → iOS gửi \u003ccode>unavailable\u003c/code>, server vẫn quyết allow hay deny.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c10\">\u003cinput type=\"checkbox\" id=\"c10\">\u003cspan>Challenge và intent trả lời trong vài giây. iOS chờ tối đa 30 giây; lỗi lần đầu thì chặn và báo thử lại, từ lần thứ hai liên tiếp thì cho mua.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c7\">\u003cinput type=\"checkbox\" id=\"c7\">\u003cspan>Deny \u003ccode>PAYMENT_028\u003c/code> / \u003ccode>PAYMENT_029\u003c/code> hiện đúng thông báo; \u003ccode>client_integrity_mode: \"report\"\u003c/code> cho máy có tín hiệu chặn mua được.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c8\">\u003cinput type=\"checkbox\" id=\"c8\">\u003cspan>Đối soát: charge có intent → attested, không có → unattested; không charge nào bị từ chối cộng.\u003c/span>\u003c/label>\u003c/li>\n        \u003cli>\u003clabel for=\"c9\">\u003cinput type=\"checkbox\" id=\"c9\">\u003cspan>Không endpoint mới nào trả 404 trần cho lỗi nghiệp vụ.\u003c/span>\u003c/label>\u003c/li>\n      \u003c/ul>\n      \u003cp style=\"margin-top:10px;color:var(--muted);font-size:13.5px\">Dấu tick chỉ lưu trên trình duyệt của bạn.\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"con-mo\">\n      \u003ch2>Còn mở\u003c/h2>\n      \u003cp class=\"sub\">Đã chốt cả ba điểm ngày 06/10/2026. Phần còn lại chỉ là việc chưa kiểm được.\u003c/p>\n      \u003cul class=\"plain\">\n        \u003cli>\u003cstrong>1. Thời điểm đăng ký key: đã chốt.\u003c/strong> Chạy nền sau khi đăng nhập; bấm Mua mà chưa có key thì đăng ký ngay trong lần đó.\u003c/li>\n        \u003cli>\u003cstrong>2. Server lỗi hoặc quá 30 giây: đã chốt.\u003c/strong> Lần đầu chặn và báo thử lại; từ lần thứ hai liên tiếp vẫn lỗi thì cho mua, tới khi server trả lời lại.\u003c/li>\n        \u003cli>\u003cstrong>3. \u003ccode>unsupported\u003c/code> từ iPhone/iPad ở \u003ccode>enforce\u003c/code>: đã chốt A\u003c/strong> (allow + flag + hold dài).\n          \u003cul class=\"plain\" style=\"margin-top:8px\">\n            \u003cli>\u003cem>Là gì:\u003c/em> máy báo không dùng được App Attest (\u003ccode>isSupported == false\u003c/code>), nên không có key, không có assertion. Trên Mac và simulator đây là chuyện bình thường. Trên iPhone/iPad thật thì gần như không xảy ra, nhưng vẫn có: một app trên App Store đo được 352 trong 153.791 iPhone thật (0,23%) bị kẹt vĩnh viễn ở trạng thái này; Apple đã hỏi log nhưng chưa có cách sửa (\u003ca href=\"https://developer.apple.com/forums/thread/802590\" target=\"_blank\" rel=\"noopener\">Developer Forums\u003c/a>). Ngoài ra, tweak jailbreak có thể giả trạng thái này để né App Attest.\u003c/li>\n            \u003cli>\u003cem>(A, đã chọn) allow + flag + hold dài:\u003c/em> vẫn cho mua, nhưng gắn cờ tài khoản và giữ lâu hơn phần thu nhập creator sinh ra từ số tiền này. Nếu sau đó bị refund hay gian lận thì còn kịp thu hồi trước khi tiền ra khỏi hệ thống. Khoảng 2 trên 1.000 user thật không bị ảnh hưởng.\u003c/li>\n            \u003cli>\u003cem>(B) deny \u003ccode>PAYMENT_028\u003c/code>:\u003c/em> chặn hẳn, hiện “Không thể mua trên thiết bị này”. Đóng được mẹo giả \u003ccode>unsupported\u003c/code>, nhưng chừng 2 trên 1.000 user thật sẽ không bao giờ mua được và không tự sửa được.\u003c/li>\n            \u003cli>\u003cem>Vì sao chọn A:\u003c/em> Apple coi \u003ccode>isSupported == false\u003c/code> là một tín hiệu rủi ro chứ không phải lý do chặn, và khuyên “Avoid blocking the user directly without a comprehensive risk assessment”. Mua Kazh tốn tiền thật; thiệt hại thật đến từ refund và chargeback, và cờ refund cùng hold payout đã chặn chỗ đó. Policy này nằm trên server, đổi lúc nào cũng được, không cần ra bản app mới.\u003c/li>\n          \u003c/ul>\n        \u003c/li>\n        \u003cli>\u003cstrong>Chưa kiểm được:\u003c/strong> attest, assert và intent thật trên máy, vì backend chưa có endpoint. QA trên iOS: Settings › Developer › Wallet › \u003cem>Buy-Kazh protection\u003c/em>.\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003cfooter>\n      \u003cdiv>Nguồn và file liên quan\u003c/div>\n      \u003cul>\n        \u003cli>\u003ca href=\"https://developer.apple.com/documentation/devicecheck/validating-apps-that-connect-to-your-server\" target=\"_blank\" rel=\"noopener\">Apple · Validating apps that connect to your server\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://developer.apple.com/documentation/devicecheck/attestation-object-validation-guide\" target=\"_blank\" rel=\"noopener\">Apple · Attestation object validation guide\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"https://developer.apple.com/documentation/devicecheck/assessing-fraud-risk\" target=\"_blank\" rel=\"noopener\">Apple · Assessing fraud risk\u003c/a>\u003c/li>\n        \u003cli>Trong repo iOS: \u003ccode>Docs/app-attest-backend.md\u003c/code> (bản markdown của trang này), \u003ccode>Docs/app-attest-backend.html\u003c/code> (trang này), \u003ccode>Docs/iap-integrity-refund-backend.md\u003c/code> (các việc backend khác)\u003c/li>\n      \u003c/ul>\n    \u003c/footer>\n  \u003c/main>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  // Copy buttons: clipboard inside the click handler, falling back to selecting the text.\n  document.querySelectorAll('.code').forEach(function (block) {\n    var button = block.querySelector('.copy');\n    var pre = block.querySelector('pre');\n    if (!button || !pre) return;\n    button.addEventListener('click', function () {\n      var text = pre.textContent;\n      var done = function () { button.textContent = 'Đã copy'; setTimeout(function () { button.textContent = 'Copy'; }, 1400); };\n      var select = function () {\n        var range = document.createRange();\n        range.selectNodeContents(pre);\n        var selection = window.getSelection();\n        selection.removeAllRanges();\n        selection.addRange(range);\n        button.textContent = 'Đã chọn';\n        setTimeout(function () { button.textContent = 'Copy'; }, 1400);\n      };\n      if (navigator.clipboard && navigator.clipboard.writeText) {\n        navigator.clipboard.writeText(text).then(done, select);\n      } else {\n        select();\n      }\n    });\n  });\n\n  // Checklist: ticks are a per-viewer convenience kept in this browser only.\n  var KEY = 'kz-app-attest-checklist-v1';\n  var boxes = Array.prototype.slice.call(document.querySelectorAll('#checklist-items input[type=\"checkbox\"]'));\n  var progress = document.getElementById('progress');\n  var saved = {};\n  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }\n  var render = function () {\n    var count = boxes.filter(function (b) { return b.checked; }).length;\n    progress.textContent = count + '/' + boxes.length + ' xong';\n  };\n  boxes.forEach(function (box) {\n    box.checked = !!saved[box.id];\n    box.addEventListener('change', function () {\n      saved[box.id] = box.checked;\n      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}\n      render();\n    });\n  });\n  render();\n\n  // Table of contents: mark the section being read.\n  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));\n  if ('IntersectionObserver' in window && links.length) {\n    var byId = {};\n    links.forEach(function (link) { byId[link.getAttribute('href').slice(1)] = link; });\n    var observer = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (!entry.isIntersecting) return;\n        links.forEach(function (link) { link.classList.remove('active'); });\n        var link = byId[entry.target.id];\n        if (link) link.classList.add('active');\n      });\n    }, { rootMargin: '-20% 0px -70% 0px' });\n    document.querySelectorAll('main section[id]').forEach(function (section) { observer.observe(section); });\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
