<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Device Lab — local iOS &amp; Android console for manual QA: identifiers, screenshots and one-click bug reports.">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="Device Lab — bauloc.github.io">
  <meta property="og:description" content="Local iOS &amp; Android console for manual QA: identifiers, screenshots and one-click bug reports.">
  <title>Device Lab</title>

  <!-- Hand-bumped cache buster: GitHub Pages serves max-age=600 and this
       repo has no build step, so the query is the only reliable buster.
       Keep the value in sync with V in app.js. -->
  <link rel="stylesheet" href="app.css?v=2026-09-08.1">

  <!-- ya-webadb ("Tango", MIT) resolved from jsDelivr. A flat import map is
       deliberate: the packages have no `exports` map and no subpath imports,
       so nine entries resolve the whole graph with no bundler. Versions are
       PINNED because Tango's docs state the public API is not stable.
       Do NOT switch to jsDelivr's /+esm: adb-daemon-webusb@2.3.2/+esm
       hardcodes adb@2.3.1/+esm, which would load two copies of adb.
       Import maps also apply to dynamic import() from classic scripts,
       which is what lets this page stay plain global-scope JS. -->
  <script type="importmap">
  {
    "imports": {
      "@yume-chan/adb": "https://cdn.jsdelivr.net/npm/@yume-chan/adb@2.6.4/esm/index.js",
      "@yume-chan/adb-daemon-webusb": "https://cdn.jsdelivr.net/npm/@yume-chan/adb-daemon-webusb@2.3.2/esm/index.js",
      "@yume-chan/adb-credential-web": "https://cdn.jsdelivr.net/npm/@yume-chan/adb-credential-web@2.1.0/esm/index.js",
      "@yume-chan/android-bin": "https://cdn.jsdelivr.net/npm/@yume-chan/android-bin@2.1.0/esm/index.js",
      "@yume-chan/stream-extra": "https://cdn.jsdelivr.net/npm/@yume-chan/stream-extra@2.6.1/esm/index.js",
      "@yume-chan/struct": "https://cdn.jsdelivr.net/npm/@yume-chan/struct@2.3.2/esm/index.js",
      "@yume-chan/async": "https://cdn.jsdelivr.net/npm/@yume-chan/async@4.1.3/esm/index.js",
      "@yume-chan/event": "https://cdn.jsdelivr.net/npm/@yume-chan/event@2.0.0/esm/index.js",
      "@yume-chan/no-data-view": "https://cdn.jsdelivr.net/npm/@yume-chan/no-data-view@2.0.0/esm/index.js"
    }
  }
  </script>
</head>
<body>

  <!-- Connection transitions, device arrive/depart and job completion are
       announced here — once each, never per tick. -->
  <p id="dvc-status" class="dvc-sr" role="status" aria-live="polite"></p>

  <div id="toast-container"></div>

  <header class="dvc-topbar">
    <span class="dvc-brand">
      <span class="dvc-brand-mark" aria-hidden="true">D</span>
      Device&nbsp;Lab
    </span>

    <!-- Two independent health chips: one per lane. A browser that can
         drive Android over USB and a helper that is not running are
         different facts and must never share one indicator. -->
    <span class="dvc-chip" id="dvc-chip-lane" data-tone="idle">…</span>
    <span class="dvc-chip" id="dvc-chip-agent" data-tone="idle">…</span>

    <div class="dvc-topbar-spacer"></div>

    <button class="btn btn-icon" id="dvc-doctor-btn" type="button" title="Environment check" aria-label="Environment check"></button>
    <button class="btn btn-icon" id="dvc-settings-btn" type="button" title="Settings" aria-label="Settings"></button>
  </header>

  <!-- Exactly one of #dvc-gate / #dvc-app is populated at a time. The gate
       is the primary screen, not an error page: most visitors arrive with
       no device selected and no helper running. -->
  <main id="dvc-gate" class="dvc-gate"></main>

  <div id="dvc-app" class="dvc-shell hidden">
    <aside class="dvc-pane dvc-list-pane" aria-label="Devices">
      <div class="dvc-pane-bar">
        <input id="dvc-list-filter" class="form-control" type="search"
               placeholder="Filter devices  ( / )" aria-label="Filter devices">
        <button class="btn btn-icon" id="dvc-refresh-btn" type="button" title="Refresh (R)" aria-label="Refresh devices"></button>
      </div>
      <div class="dvc-facets" id="dvc-facets"></div>
      <ul id="dvc-list" class="dvc-list" role="list"></ul>
      <div id="dvc-list-empty" class="empty-state hidden"></div>
    </aside>

    <section class="dvc-pane dvc-detail-pane" id="dvc-detail" aria-label="Device detail"></section>
  </div>

  <section id="dvc-console" class="dvc-console collapsed hidden" aria-label="Device log">
    <div class="dvc-console-bar">
      <button id="dvc-console-toggle" class="dvc-console-title" type="button"
              aria-expanded="false" aria-controls="dvc-log">
        Log console <span id="dvc-log-count">0</span>
      </button>
    </div>
    <!-- aria-live is deliberately off: narrating every logcat line is unusable. -->
    <div id="dvc-log" class="dvc-log" role="log" aria-live="off" tabindex="0"></div>
  </section>

  <div id="dvc-drawer-overlay" class="dvc-drawer-overlay"></div>
  <aside id="dvc-drawer" class="dvc-drawer" role="dialog" aria-modal="true"
         aria-labelledby="dvc-drawer-title" hidden></aside>

  <div id="dvc-modal" class="modal-overlay hidden"></div>

  <script src="app.js?v=2026-09-08.1"></script>
</body>
</html>
